name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
          POSTGRES_DB: seatlock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatlock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://seatlock:seatlock@localhost:5432/seatlock
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Deploy checks with production settings
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "false"
          SECRET_KEY: ci-only-key-${{ github.run_id }}-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: example.com
          FORCE_HTTPS: "true"
      - run: uv run pytest --cov=workshops

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Needs no AWS credentials. Checks that both environments synthesize.
      - run: npx --yes aws-cdk@2.1146.0 synth --quiet
      - run: npx --yes aws-cdk@2.1146.0 synth --quiet --context env=prod
