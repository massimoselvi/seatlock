# Local development stack: docker compose up --build
x-backend: &backend
  build: ./backend
  volumes:
    - ./backend:/app
  environment: &backend-env
    DEBUG: "true"
    DATABASE_URL: postgres://seatlock:seatlock@db:5432/seatlock
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      VITE_API_PROXY: http://web:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
